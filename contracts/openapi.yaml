      required:
        - facilities
    MoneyRequest:
      type: object
      properties:
        amount:
          type: integer
          nullable: false
          minimum: 1
          maximum: 1000000
          example: 19000
          description: 'Whole minor units: piastres for EGP, so 19000 is EGP 190.00. From 1 to 1000000.'
        currency:
          type: string
          enum:
            - EGP
          nullable: false
          example: EGP
          description: ISO 4217 currency code. Always EGP in v1.
      required:
