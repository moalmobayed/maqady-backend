  /auth/registrations:
    post:
      description: |-
        Public: the Create account form (`/register`, standalone or in the booking flow). Creates the account, emails a verification link and signs the customer in, so the booking flow can claim its hold next.

        - An email that already has an account, in any letter case, is `EMAIL_TAKEN`.
        - The verification link opens `/verify-email?token=` and works for 24 hours. Verification blocks nothing.
        - The access token lasts 15 minutes; the session ends 30 days after sign-in however often it is refreshed.
        - Limited to 5 registrations per hour per address (`RATE_LIMITED`).
        - Responses carry credentials, so `Idempotency-Key` is ignored and nothing is stored. A repeated registration answers `EMAIL_TAKEN`.
