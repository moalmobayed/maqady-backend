          maxLength: 100
          example: Maqady Zamalek
          description: Unique among theaters, ignoring letter case (`CONFLICT` when taken). Trimmed.
        address:
          type: string
          nullable: false
          minLength: 1
          maxLength: 200
          example: 26 July Street, Zamalek
          description: Street address. Trimmed.
        district:
          type: string
          nullable: false
          minLength: 1
          maxLength: 80
          example: Zamalek
          description: District or area. Trimmed.
        city:
          type: string
          nullable: false
          minLength: 1
          maxLength: 80
          example: Cairo
          description: City. Trimmed.
        latitude:
          type: number
          nullable: false
          minimum: -90
          maximum: 90
          example: 30.0609
          description: Decimal degrees, at most 6 decimals.
        longitude:
          type: number
          nullable: false
          minimum: -180
          maximum: 180
          example: 31.2197
          description: Decimal degrees, at most 6 decimals.
        transitInfo:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          example: 'Metro: Opera station, then a 10-minute walk.'
          description: '"Public transport". Null removes it. Trimmed.'
        parkingInfo:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          example: Valet parking at the main entrance.
          description: '"Parking". Null removes it. Trimmed.'
        email:
          type: string
          format: email
          nullable: true
          maxLength: 320
          example: zamalek@maqady.example
          description: Contact email. Null removes it.
        showContactsPublic:
          type: boolean
          nullable: false
          example: true
          description: '"Show phone numbers and email on the website".'
        status:
          nullable: false
          example: active
          description: '`active` on a draft publishes it, once its zone prices, opening hours and an active hall are set (`THEATER_NOT_PUBLISHABLE` lists what is missing). `sales_paused` and `active` toggle selling on a published theater. A published theater never returns to `draft`, and a draft cannot be paused: `CONFLICT` with `details.from` and `details.to`.'
          allOf:
            - $ref: '#/components/schemas/TheaterStatus'
    DayHoursRequest:
      type: object
      properties:
        weekday:
          type: integer
          nullable: false
          minimum: 1
          maximum: 7
          example: 5
          description: 'ISO weekday of the cinema date: 1 = Monday … 7 = Sunday. A cinema day runs from 06:00 to 06:00, so Friday night until 02:00 is Friday (5).'
        closed:
          type: boolean
          nullable: false
          example: false
          description: True when the theater is closed that day; then leave out `opens` and `closes`.
        opens:
          type: string
          nullable: false
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '12:00'
          description: Opening time, `HH:mm` from 06:00 to 23:59, Cairo time. Required when open.
        closes:
          type: string
          nullable: false
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '01:00'
          description: Closing time, `HH:mm`, Cairo time. A time at or before 06:00 is on the next day ("next day" in the editor), so `01:00` after `12:00` closes at 01:00 the next morning. Must be after `opens`; required when open.
      required:
        - weekday
        - closed
    ReplaceHoursRequest:
      type: object
      properties:
        days:
          minItems: 7
          maxItems: 7
          description: Exactly 7 entries, one per weekday 1–7, in any order.
          type: array
          items:
            $ref: '#/components/schemas/DayHoursRequest'
      required:
        - days
    PhoneRequest:
      type: object
      properties:
        label:
          type: string
          nullable: false
          minLength: 1
          maxLength: 40
          example: Box office
          description: 'What the number is for: Main line, Box office, WhatsApp, Cinema manager. Trimmed.'
        number:
          type: string
          nullable: false
          pattern: ^\+[1-9][0-9]{6,14}$
          example: '+20227351100'
          description: 'E.164: `+`, the country code and the number, digits only.'
      required:
        - label
        - number
    ReplacePhonesRequest:
      type: object
      properties:
        phones:
          maxItems: 10
          description: Up to 10 phones, in display order; the first is the main phone shown on cards. Empty removes every phone.
          type: array
          items:
            $ref: '#/components/schemas/PhoneRequest'
      required:
        - phones
    ReplaceFacilitiesRequest:
      type: object
      properties:
