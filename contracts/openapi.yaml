        middle:
          description: Middle rows. Same currency as `front`.
          example:
            amount: 19000
            currency: EGP
          allOf:
            - $ref: '#/components/schemas/MoneyRequest'
        back:
          description: Back rows. Same currency as `front`.
          example:
            amount: 23000
            currency: EGP
          allOf:
            - $ref: '#/components/schemas/MoneyRequest'
      required:
        - front
        - middle
        - back
    CreateSpecialDateRequest:
      type: object
      properties:
        cinemaDate:
          type: string
