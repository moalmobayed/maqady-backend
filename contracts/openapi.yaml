        - **Status.** draft → coming soon, now showing or archived; coming soon → draft, now showing or archived; now showing → archived; archived → coming soon or now showing. Anything else is `CONFLICT` with `details.from` and `details.to`.
        - **Publishing.** A Coming soon or Now showing movie needs a synopsis, runtime, release date and at least one genre (a poster is optional): `MOVIE_NOT_PUBLISHABLE` with `details.missing`. Clearing one of them on a public movie is refused the same way.
        - **Carousel.** `featuredPosition` 1 to 5 needs a public movie with a hero video (`MOVIE_NOT_FEATURABLE` with `details.reasons`), and a position no other movie holds (`FEATURED_POSITION_TAKEN` with the holder's `movieId`). Moving to draft or archived frees the position.
        - **Media.** `heroVideoId` and `backdropPhotoId` must be this movie's own (`VALIDATION_FAILED`); a backdrop must be 16:9 and at least 1280 × 720 (`IMAGE_WRONG_SHAPE`).
        - An unknown genre id is `VALIDATION_FAILED` on `genreIds`. A change to the values the movie already has answers `200` and changes nothing.
        - Recorded in the activity log with the names of the changed fields.
