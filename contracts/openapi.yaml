  /admin/auth/sessions:
    post:
      description: |-
        Public: the staff sign-in page (`/admin/login`) calls it with an email and password, and gets a token pair plus who signed in.

        - A wrong password, an unknown email and an invited member who has not set a password all answer `INVALID_CREDENTIALS`; the answer never says which.
        - A deactivated member with the right password gets `ACCOUNT_DEACTIVATED`.
        - The access token lasts 15 minutes; the refresh token rotates on every refresh, and the session ends 12 hours after sign-in however often it is refreshed.
        - Limited to 5 attempts per minute per address and email, and 20 per minute per address (`RATE_LIMITED`).
        - Responses carry credentials, so `Idempotency-Key` is ignored; a repeated sign-in opens a second session.
      operationId: signIn
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSignInRequest'
      responses:
        '201':
          description: Signed in
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSessionResponse'
        '400':
          description: '`VALIDATION_FAILED`: The body, query, path or a header failed validation. When the request could be parsed, `details.fields` lists each problem as `{ field, messages }`, with dotted paths such as `seats.0.label` (a header appears under its name, for example `Idempotency-Key`). `details` is null when the body could not be read, for example malformed JSON.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: The request is not valid.
                      details:
