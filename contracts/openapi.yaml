          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL:
                  summary: INTERNAL
                  value:
                    error:
                      code: INTERNAL
                      message: Something went wrong on our side.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
      summary: Remove a theater's cover
      tags:
        - 'Admin: theaters'
      security:
        - staff: []
  /admin/messages:
    get:
      description: |-
        Admin only: the Message log. Every email and SMS the system queued, sent or simulated, newest first, with time, channel, recipient, subject, delivery status and the customer, staff member or booking it relates to.

        - Filter by `channel`, `status`, and a time range: `from` (inclusive) and `to` (exclusive), as ISO 8601 instants with their offset.
        - One-time links (invites, resets, verification) are never shown: they read `[one-time link hidden]`.
        - Cursor-paginated: pass `nextCursor` back as `cursor`.
      operationId: listMessages
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque. Omit for the first page; then pass `nextCursor` from the previous page unchanged.
          schema:
            maxLength: 512
            nullable: false
            example: WyIyMDI2LTEwLTE2VDE5OjMwOjAwKzAzOjAwIiw0Ml0
            type: string
        - name: limit
          required: false
          in: query
          description: Items per page, 1 to 100. Default 20.
          schema:
            minimum: 1
            maximum: 100
            nullable: false
            default: 20
            example: 20
            type: integer
        - name: channel
          required: false
          in: query
          description: Only emails, or only SMS.
          schema:
            $ref: '#/components/schemas/MessageChannel'
        - name: status
          required: false
          in: query
          description: Only messages in this delivery status.
          schema:
            $ref: '#/components/schemas/MessageStatus'
        - name: from
          required: false
          in: query
          description: Only messages created at or after this instant (inclusive). ISO 8601 with its offset; send the start of the first Cairo day picked.
          schema:
            format: date-time
            nullable: false
            example: '2026-10-16T00:00:00+03:00'
            type: string
        - name: to
          required: false
          in: query
          description: Only messages created before this instant (exclusive). ISO 8601 with its offset; send the start of the day after the last Cairo day picked. Must be later than `from`.
          schema:
            format: date-time
            nullable: false
            example: '2026-10-17T00:00:00+03:00'
            type: string
      responses:
        '200':
          description: One page of messages
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSummaryResponsePage'
        '400':
          description: '`VALIDATION_FAILED`: The body, query, path or a header failed validation. When the request could be parsed, `details.fields` lists each problem as `{ field, messages }`, with dotted paths such as `seats.0.label` (a header appears under its name, for example `Idempotency-Key`). `details` is null when the body could not be read, for example malformed JSON.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: The request is not valid.
                      details:
                        fields:
                          - field: seats.0.label
                            messages:
                              - label must be a string
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '401':
          description: |-
            `UNAUTHENTICATED`: No valid access token was sent: none, malformed, expired, or for the other site (a customer token on an admin route, or the reverse). Refresh the tokens, or sign in, and retry.

            `SESSION_EXPIRED`: The refresh token is past its lifetime. Sign in again.

            `SESSION_REVOKED`: The session was ended: signed out, the account was blocked or deactivated, or an old refresh token was reused. Sign in again.
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  summary: UNAUTHENTICATED
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Sign in to continue.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
                SESSION_EXPIRED:
                  summary: SESSION_EXPIRED
                  value:
                    error:
                      code: SESSION_EXPIRED
                      message: Your session has expired. Sign in again.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
                SESSION_REVOKED:
                  summary: SESSION_REVOKED
                  value:
                    error:
                      code: SESSION_REVOKED
                      message: You were signed out. Sign in again.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '403':
          description: |-
            `ACCOUNT_DEACTIVATED`: The staff account was deactivated by an admin.

            `FORBIDDEN`: The signed-in account may not perform this action, for example a box office account on an admin-only route.
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_DEACTIVATED:
                  summary: ACCOUNT_DEACTIVATED
                  value:
                    error:
                      code: ACCOUNT_DEACTIVATED
                      message: This staff account is deactivated.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
                FORBIDDEN:
                  summary: FORBIDDEN
                  value:
                    error:
                      code: FORBIDDEN
                      message: You do not have access to this.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '429':
          description: '`RATE_LIMITED`: A rate limit was reached. Wait for the number of seconds in the `Retry-After` header, then retry.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RATE_LIMITED:
                  summary: RATE_LIMITED
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Too many requests. Try again shortly.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '500':
          description: '`INTERNAL`: An unexpected error. Quote `correlationId` when reporting it.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL:
                  summary: INTERNAL
                  value:
                    error:
                      code: INTERNAL
                      message: Something went wrong on our side.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
      summary: List messages
      tags:
        - 'Admin: messages'
      security:
        - staff: []
