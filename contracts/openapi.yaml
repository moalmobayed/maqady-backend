    post:
      description: |-
        Public: the Set a new password page (`/reset-password?token=`) posts the link's `token` and the new password.

        - Success sets the password, marks the email verified (the link proved the mailbox) and signs the customer out everywhere. It opens no session: send them to sign in with the new password.
