          example: |-
            Hello Mona Adel,

            An admin has invited you to the Maqady dashboard as Box office.

            Set your password within 72 hours.
            [one-time link hidden]
          description: 'The plain-text body as stored. Invite, reset and verification links read `[one-time link hidden]`: they are only in the email itself.'
        bodyHtml:
