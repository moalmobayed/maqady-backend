          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  summary: UNAUTHENTICATED
