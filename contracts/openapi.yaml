        opens:
          type: string
          nullable: false
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '10:00'
          description: Opening time, `HH:mm` from 06:00 to 23:59. Required when open.
        closes:
          type: string
          nullable: false
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '03:00'
          description: Closing time, `HH:mm`; at or before 06:00 is the next day. After `opens`; required when open.
      required:
        - cinemaDate
        - label
        - closed
    UpdateSpecialDateRequest:
      type: object
      properties:
        cinemaDate:
          type: string
          format: date
          nullable: false
          example: '2026-10-06'
          description: 'Moves the special date to another cinema date: today''s or later, and free.'
        label:
          type: string
          nullable: false
          minLength: 1
          maxLength: 80
          example: Armed Forces Day
          description: Trimmed.
        closed:
          type: boolean
          nullable: false
          example: true
          description: True closes the theater that day (leave out the times); false opens it.
        opens:
          type: string
          nullable: false
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
