info:
  title: Maqady API
  description: |-
    The Maqady cinema seat-booking API, behind the customer website and the admin dashboard.

    Conventions that apply to every endpoint:

    - Base path `/api/v1`. JSON with camelCase fields.
    - Times are ISO 8601 in Cairo time with their offset, for example `2026-10-16T19:30:00+03:00`. A cinema day runs from 06:00 to 06:00, so a 00:30 show belongs to the previous day's `cinemaDate`.
    - Ids are integers. Money is `{ "amount": <piastres>, "currency": "EGP" }`.
    - Lists are cursor-paginated and return `{ "items", "nextCursor", "total" }`.
    - Every error has the same shape (`ErrorResponse`): `{ "error": { "code", "message", "details", "correlationId" } }`. Branch on `code`, never on `message`. Each operation lists the codes it can return.
    - Every response carries an `X-Request-Id` header. Send your own UUID in `X-Request-Id` to correlate a request; any other value is replaced with a new UUID.
    - Writes accept an `Idempotency-Key` header: a new UUID per user action, reused when retrying that same action.
    - Signed-in routes take `Authorization: Bearer <access token>`: the `customer` scheme on the customer website, `staff` on the admin dashboard.
    - The free server sleeps when idle, so the first request after a pause can take much longer. Show a "waking up" state rather than an error; `GET /health` is a cheap way to wake it.
  version: 0.1.0
tags:
  - name: Health
    description: Liveness and readiness
  - name: 'Admin: auth'
    description: Staff sign-in, token refresh, sign-out and the signed-in member
  - name: 'Admin: staff'
    description: 'Staff accounts: list, roles and status (admins only)'
servers:
  - url: /api/v1
    description: The server hosting these docs
  - url: http://localhost:3000/api/v1
    description: Local development
components:
  securitySchemes:
    customer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Customer access token (15 minutes), from customer sign-in or refresh.
    staff:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Staff access token (15 minutes), from staff sign-in or refresh.
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          nullable: false
          example: ok
          description: Always `ok`. A failed check answers with an error response instead.
      required:
        - status
    StaffSignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: mona.adel@maqady.example
          description: The staff email. Letter case does not matter.
        password:
          type: string
          format: password
          nullable: false
          minLength: 1
          maxLength: 128
          example: Cinema2026
          description: The password as typed. The password policy is not checked here.
      required:
        - email
        - password
    StaffRole:
      type: string
      enum:
        - admin
        - box_office
      description: '`admin` sees every screen; `box_office` sees Bookings, Customers and Scan tickets. Read from the database on every request.'
    StaffProfileResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 3
          description: Staff member id.
        fullName:
          type: string
          nullable: false
          example: Mona Adel
          description: Full name.
        email:
          type: string
          format: email
          nullable: false
          example: mona.adel@maqady.example
          description: Staff email.
        role:
          nullable: false
          example: admin
          description: '`admin` sees every screen; `box_office` sees Bookings, Customers and Scan tickets. Read from the database on every request.'
          allOf:
            - $ref: '#/components/schemas/StaffRole'
      required:
        - id
        - fullName
        - email
        - role
    StaffSessionResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
          description: 'Send as `Authorization: Bearer <accessToken>`. Valid 15 minutes; keep it in memory only.'
        accessTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:45:00+03:00'
          description: When the access token stops working. Refresh shortly before.
        refreshToken:
          type: string
          nullable: false
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: Opaque, single use. Exchange it at the refresh route for a new pair, and store the new one in place of this one.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-21T07:30:00+03:00'
          description: 'When the session ends: 12 hours after sign-in for staff, 30 days for customers. Refreshing never extends it; sign in again after.'
        staff:
          nullable: false
          description: Who signed in, for the dashboard shell.
          allOf:
            - $ref: '#/components/schemas/StaffProfileResponse'
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - staff
    RefreshTokensRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: false
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: 'The refresh token from the last sign-in or refresh. Each one works once: replace both stored tokens with the pair this call returns.'
      required:
        - refreshToken
    SessionTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
          description: 'Send as `Authorization: Bearer <accessToken>`. Valid 15 minutes; keep it in memory only.'
        accessTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:45:00+03:00'
          description: When the access token stops working. Refresh shortly before.
        refreshToken:
          type: string
          nullable: false
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: Opaque, single use. Exchange it at the refresh route for a new pair, and store the new one in place of this one.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-21T07:30:00+03:00'
          description: 'When the session ends: 12 hours after sign-in for staff, 30 days for customers. Refreshing never extends it; sign in again after.'
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
    StaffStatus:
      type: string
      enum:
        - invited
        - active
        - deactivated
    StaffMemberResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 3
          description: Staff member id.
        fullName:
          type: string
          nullable: false
          example: Mona Adel
          description: Full name.
        email:
          type: string
          format: email
          nullable: false
          example: mona.adel@maqady.example
          description: Staff email; unique among staff.
        role:
          nullable: false
          example: box_office
          description: '`admin` or `box_office`.'
          allOf:
            - $ref: '#/components/schemas/StaffRole'
        status:
          nullable: false
          example: active
          description: '`invited`: has not set a password yet. `active`: may sign in. `deactivated`: switched off by an admin; can be reactivated.'
          allOf:
            - $ref: '#/components/schemas/StaffStatus'
        lastSignInAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-20T09:12:00+03:00'
          description: The last successful sign-in; null if the member never signed in.
        createdAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-01T10:00:00+03:00'
          description: When the member was created (invited, or created by the setup command).
      required:
        - id
        - fullName
        - email
        - role
        - status
        - lastSignInAt
        - createdAt
    StaffMemberResponsePage:
      type: object
      properties:
        items:
          nullable: false
          description: This page, in list order. Empty when nothing matches.
          type: array
          items:
            $ref: '#/components/schemas/StaffMemberResponse'
        nextCursor:
          type: string
          nullable: true
          example: WyIyMDI2LTEwLTE2VDE5OjMwOjAwKzAzOjAwIiw0Ml0
          description: Pass as `cursor` to get the next page; null on the last page.
        total:
          type: integer
          minimum: 0
          nullable: false
          example: 42
          description: How many items the whole list has, with the same filters.
      required:
        - items
        - nextCursor
        - total
    UpdateStaffMemberRequest:
      type: object
      properties:
        role:
          nullable: false
          example: box_office
          description: The new role. Demoting an admin signs them out everywhere; they sign in again as box office. Refused with `LAST_ADMIN` for the only active admin.
          allOf:
            - $ref: '#/components/schemas/StaffRole'
        status:
          type: string
          enum:
            - active
            - deactivated
          nullable: false
          example: deactivated
          description: '`deactivated` signs the member out everywhere and voids their unused invite or reset links; refused with `LAST_ADMIN` for the only active admin. `active` reactivates a deactivated member; one who never set a password returns to `invited` instead, so the invite can be resent. `active` on an invited member is `VALIDATION_FAILED`: they become active by setting their password.'
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          description: The error. Every Maqady error response has exactly this shape.
          required:
            - code
            - message
            - details
            - correlationId
          properties:
            code:
              type: string
              nullable: false
              description: Stable machine-readable code, for example RATE_LIMITED
              example: NOT_FOUND
            message:
              type: string
              nullable: false
              description: Human-readable; don't parse it
              example: The requested resource was not found.
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: Extra structured information; its shape depends on the code
              example: null
            correlationId:
              type: string
              format: uuid
              nullable: false
              description: Equals the X-Request-Id response header. Quote it when reporting a problem.
              example: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
      required:
        - error
