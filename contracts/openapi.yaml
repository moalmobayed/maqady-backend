  /auth/sessions:
    post:
      description: |-
        Public: the Sign in form (`/login`, standalone or in the booking flow). Returns a token pair and the customer.

        - A wrong password and an unknown email both answer `INVALID_CREDENTIALS`; the answer never says which.
        - A blocked customer with the right password gets `ACCOUNT_BLOCKED`: show the "Account blocked" screen.
        - The access token lasts 15 minutes; the refresh token rotates on every refresh, and the session ends 30 days after sign-in.
        - Limited to 5 attempts per minute per address and email, and 20 per minute per address (`RATE_LIMITED`, "too many attempts").
        - Responses carry credentials, so `Idempotency-Key` is ignored and nothing is stored. A repeated sign-in opens a second session.
      operationId: signInCustomer
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
