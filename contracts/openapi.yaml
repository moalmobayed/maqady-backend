              examples:
                ACCOUNT_BLOCKED:
                  summary: ACCOUNT_BLOCKED
                  value:
                    error:
                      code: ACCOUNT_BLOCKED
                      message: This account is blocked.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '409':
          description: '`REFRESH_CONFLICT`: The refresh token was rotated less than 30 seconds ago, typically by another tab. Read the tokens already stored and use those.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
