            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: The request is not valid.
                      details:
                        fields:
                          - field: seats.0.label
                            messages:
                              - label must be a string
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '401':
          description: |-
            `UNAUTHENTICATED`: No valid access token was sent: none, malformed, expired, or for the other site (a customer token on an admin route, or the reverse). Refresh the tokens, or sign in, and retry.

            `SESSION_EXPIRED`: The refresh token is past its lifetime. Sign in again.

            `SESSION_REVOKED`: The session was ended: signed out, the account was blocked or deactivated, or an old refresh token was reused. Sign in again.
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  summary: UNAUTHENTICATED
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Sign in to continue.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
                SESSION_EXPIRED:
                  summary: SESSION_EXPIRED
                  value:
                    error:
                      code: SESSION_EXPIRED
                      message: Your session has expired. Sign in again.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
                SESSION_REVOKED:
                  summary: SESSION_REVOKED
                  value:
                    error:
                      code: SESSION_REVOKED
                      message: You were signed out. Sign in again.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '403':
          description: '`ACCOUNT_BLOCKED`: The customer account was blocked by an admin. Contact the cinema.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_BLOCKED:
                  summary: ACCOUNT_BLOCKED
                  value:
                    error:
                      code: ACCOUNT_BLOCKED
                      message: This account is blocked.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '413':
          description: '`PAYLOAD_TOO_LARGE`: JSON bodies are limited to 1 MB.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PAYLOAD_TOO_LARGE:
                  summary: PAYLOAD_TOO_LARGE
                  value:
                    error:
                      code: PAYLOAD_TOO_LARGE
                      message: The request body is too large.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '429':
          description: '`RATE_LIMITED`: A rate limit was reached. Wait for the number of seconds in the `Retry-After` header, then retry.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RATE_LIMITED:
                  summary: RATE_LIMITED
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Too many requests. Try again shortly.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '500':
          description: '`INTERNAL`: An unexpected error. Quote `correlationId` when reporting it.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL:
                  summary: INTERNAL
                  value:
                    error:
                      code: INTERNAL
                      message: Something went wrong on our side.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
      summary: Change the password
      tags:
        - Profile
      security:
        - customer: []
info:
  title: Maqady API
  description: |-
    The Maqady cinema seat-booking API, behind the customer website and the admin dashboard.

    Conventions that apply to every endpoint:

    - Base path `/api/v1`. JSON with camelCase fields.
    - Times are ISO 8601 in Cairo time with their offset, for example `2026-10-16T19:30:00+03:00`. A cinema day runs from 06:00 to 06:00, so a 00:30 show belongs to the previous day's `cinemaDate`.
    - Ids are integers. Money is `{ "amount": <piastres>, "currency": "EGP" }`.
    - Lists are cursor-paginated and return `{ "items", "nextCursor", "total" }`.
    - Every error has the same shape (`ErrorResponse`): `{ "error": { "code", "message", "details", "correlationId" } }`. Branch on `code`, never on `message`. Each operation lists the codes it can return.
    - Every response carries an `X-Request-Id` header. Send your own UUID in `X-Request-Id` to correlate a request; any other value is replaced with a new UUID.
    - Writes accept an `Idempotency-Key` header: a new UUID per user action, reused when retrying that same action.
    - Signed-in routes take `Authorization: Bearer <access token>`: the `customer` scheme on the customer website, `staff` on the admin dashboard.
    - The free server sleeps when idle, so the first request after a pause can take much longer. Show a "waking up" state rather than an error; `GET /health` is a cheap way to wake it.
  version: 0.1.0
tags:
  - name: Health
    description: Liveness and readiness
  - name: 'Admin: auth'
    description: Staff sign-in, token refresh, sign-out and the signed-in member
  - name: 'Admin: staff'
    description: 'Staff accounts: list, roles and status (admins only)'
  - name: Auth
    description: Customer sign-up, sign-in, token refresh and sign-out, email verification and password reset
  - name: Profile
    description: 'The signed-in customer: details and password'
servers:
  - url: /api/v1
    description: The server hosting these docs
  - url: http://localhost:3000/api/v1
    description: Local development
components:
  securitySchemes:
    customer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Customer access token (15 minutes), from customer sign-in or refresh.
    staff:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Staff access token (15 minutes), from staff sign-in or refresh.
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          nullable: false
          example: ok
          description: Always `ok`. A failed check answers with an error response instead.
      required:
        - status
    StaffSignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: mona.adel@maqady.example
          description: The staff email. Letter case does not matter.
        password:
          type: string
          format: password
          nullable: false
          minLength: 1
          maxLength: 128
          example: Cinema2026
          description: The password as typed. The password policy is not checked here.
      required:
        - email
        - password
    StaffRole:
      type: string
      enum:
        - admin
        - box_office
      description: '`admin` sees every screen; `box_office` sees Bookings, Customers and Scan tickets. Read from the database on every request.'
    StaffProfileResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 3
          description: Staff member id.
        fullName:
          type: string
          nullable: false
          example: Mona Adel
          description: Full name.
        email:
          type: string
          format: email
          nullable: false
          example: mona.adel@maqady.example
          description: Staff email.
        role:
          nullable: false
          example: admin
          description: '`admin` sees every screen; `box_office` sees Bookings, Customers and Scan tickets. Read from the database on every request.'
          allOf:
            - $ref: '#/components/schemas/StaffRole'
      required:
        - id
        - fullName
        - email
        - role
    StaffSessionResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
          description: 'Send as `Authorization: Bearer <accessToken>`. Valid 15 minutes; keep it in memory only.'
        accessTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:45:00+03:00'
          description: When the access token stops working. Refresh shortly before.
        refreshToken:
          type: string
          nullable: false
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: Opaque, single use. Exchange it at the refresh route for a new pair, and store the new one in place of this one.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-21T07:30:00+03:00'
          description: 'When the session ends: 12 hours after sign-in for staff, 30 days for customers. Refreshing never extends it; sign in again after.'
        staff:
          nullable: false
          description: Who signed in, for the dashboard shell.
          allOf:
            - $ref: '#/components/schemas/StaffProfileResponse'
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - staff
    RefreshTokensRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: false
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: 'The refresh token from the last sign-in or refresh. Each one works once: replace both stored tokens with the pair this call returns.'
      required:
        - refreshToken
    SessionTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
          description: 'Send as `Authorization: Bearer <accessToken>`. Valid 15 minutes; keep it in memory only.'
        accessTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:45:00+03:00'
          description: When the access token stops working. Refresh shortly before.
        refreshToken:
          type: string
          nullable: false
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: Opaque, single use. Exchange it at the refresh route for a new pair, and store the new one in place of this one.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-21T07:30:00+03:00'
          description: 'When the session ends: 12 hours after sign-in for staff, 30 days for customers. Refreshing never extends it; sign in again after.'
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
    StaffStatus:
      type: string
      enum:
        - invited
        - active
        - deactivated
    StaffMemberResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 3
          description: Staff member id.
        fullName:
          type: string
          nullable: false
          example: Mona Adel
          description: Full name.
        email:
          type: string
          format: email
          nullable: false
          example: mona.adel@maqady.example
          description: Staff email; unique among staff.
        role:
          nullable: false
          example: box_office
          description: '`admin` or `box_office`.'
          allOf:
            - $ref: '#/components/schemas/StaffRole'
        status:
          nullable: false
          example: active
          description: '`invited`: has not set a password yet. `active`: may sign in. `deactivated`: switched off by an admin; can be reactivated.'
          allOf:
            - $ref: '#/components/schemas/StaffStatus'
        lastSignInAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-20T09:12:00+03:00'
          description: The last successful sign-in; null if the member never signed in.
        createdAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-01T10:00:00+03:00'
          description: When the member was created (invited, or created by the setup command).
      required:
        - id
        - fullName
        - email
        - role
        - status
        - lastSignInAt
        - createdAt
    StaffMemberResponsePage:
      type: object
      properties:
        items:
          nullable: false
          description: This page, in list order. Empty when nothing matches.
          type: array
          items:
            $ref: '#/components/schemas/StaffMemberResponse'
        nextCursor:
          type: string
          nullable: true
          example: WyIyMDI2LTEwLTE2VDE5OjMwOjAwKzAzOjAwIiw0Ml0
          description: Pass as `cursor` to get the next page; null on the last page.
        total:
          type: integer
          minimum: 0
          nullable: false
          example: 42
          description: How many items the whole list has, with the same filters.
      required:
        - items
        - nextCursor
        - total
    UpdateStaffMemberRequest:
      type: object
      properties:
        role:
          nullable: false
          example: box_office
          description: The new role. Demoting an admin signs them out everywhere; they sign in again as box office. Refused with `LAST_ADMIN` for the only active admin.
          allOf:
            - $ref: '#/components/schemas/StaffRole'
        status:
          type: string
          enum:
            - active
            - deactivated
          nullable: false
          example: deactivated
          description: '`deactivated` signs the member out everywhere and voids their unused invite or reset links; refused with `LAST_ADMIN` for the only active admin. `active` reactivates a deactivated member; one who never set a password returns to `invited` instead, so the invite can be resent. `active` on an invited member is `VALIDATION_FAILED`: they become active by setting their password.'
    RegisterCustomerRequest:
      type: object
      properties:
        fullName:
          type: string
          nullable: false
          minLength: 1
          maxLength: 100
          example: Layla Hassan
          description: Full name, as shown on the Profile. Surrounding spaces are dropped.
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: layla.hassan@example.com
          description: The sign-in email; a verification link is sent to it. Letter case does not matter, and an email already registered is `EMAIL_TAKEN`. It cannot be changed later.
        password:
          type: string
          format: password
          nullable: false
          minLength: 8
          maxLength: 128
          example: Cinema2026
          description: At least 8 characters including a digit, at most 128.
      required:
        - fullName
        - email
        - password
    CustomerProfileResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 42
          description: Customer id.
        fullName:
          type: string
          nullable: false
          example: Layla Hassan
          description: Full name.
        email:
          type: string
          format: email
          nullable: false
          example: layla.hassan@example.com
          description: The sign-in email, as registered. Read-only.
        phone:
          type: string
          nullable: true
          example: '+201012345678'
          description: Mobile number in international (E.164) form, or null when none is on file.
        emailVerified:
          type: boolean
          nullable: false
          example: false
          description: Show "Verified", or "Not verified" with a resend link (`POST /auth/email-verification-requests`). Verification blocks nothing.
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-20T19:45:00+03:00'
          description: When the email was verified, or null while it is not.
        memberSince:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:30:00+03:00'
          description: When the account was created, for "Member since".
      required:
        - id
        - fullName
        - email
        - phone
        - emailVerified
        - emailVerifiedAt
        - memberSince
    CustomerSessionResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
          description: 'Send as `Authorization: Bearer <accessToken>`. Valid 15 minutes; keep it in memory only.'
        accessTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:45:00+03:00'
          description: When the access token stops working. Refresh shortly before.
        refreshToken:
          type: string
          nullable: false
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: Opaque, single use. Exchange it at the refresh route for a new pair, and store the new one in place of this one.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-21T07:30:00+03:00'
          description: 'When the session ends: 12 hours after sign-in for staff, 30 days for customers. Refreshing never extends it; sign in again after.'
        customer:
          nullable: false
          description: Who is signed in, as `GET /me` returns it.
          allOf:
            - $ref: '#/components/schemas/CustomerProfileResponse'
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - customer
    CustomerSignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: layla.hassan@example.com
          description: The account email. Letter case does not matter.
        password:
          type: string
          format: password
          nullable: false
          minLength: 1
          maxLength: 128
          example: Cinema2026
          description: The password as typed. The password policy is not checked here.
      required:
        - email
        - password
    EmailVerificationRequest:
      type: object
      properties:
        token:
          type: string
          nullable: false
          minLength: 1
          maxLength: 128
          example: Vq3b8kP0xYz1nR5tL9wE2cU7mA4sD6fG8hJ0kL2qW3e
          description: The `token` query value of the emailed `/verify-email?token=` link, unchanged. A used, expired or mangled one is `INVALID_TOKEN`.
      required:
        - token
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: layla.hassan@example.com
          description: The account email. The answer is the same whether or not an account has it, so show "If an account exists for that email, we've sent a link".
      required:
        - email
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          nullable: false
          minLength: 1
          maxLength: 128
          example: Vq3b8kP0xYz1nR5tL9wE2cU7mA4sD6fG8hJ0kL2qW3e
          description: 'The `token` query value of the emailed `/reset-password?token=` link, unchanged. A used, expired or mangled one is `INVALID_TOKEN`: offer a new link.'
        password:
          type: string
          format: password
          nullable: false
          minLength: 8
          maxLength: 128
          example: NewCinema2026
          description: 'The new password: at least 8 characters including a digit. A weak one is refused before the link is used, so the link still works.'
      required:
        - token
        - password
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          nullable: false
          minLength: 1
          maxLength: 100
          example: Layla Hassan
          description: 'Full name, required on the profile: it can be changed, never emptied.'
        phone:
          type: string
          nullable: true
          pattern: ^(\+[1-9][0-9]{7,14}|01[0125][0-9]{8})$
          example: '+201012345678'
          description: Optional mobile number for ticket SMS. International form (`+201012345678`), or an Egyptian mobile as typed locally (`01012345678`), which is stored and returned as `+201012345678`. `null` removes it.
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          nullable: false
          minLength: 1
          maxLength: 128
          example: Cinema2026
          description: The password in use now. A wrong one is `VALIDATION_FAILED` with this field named in `details.fields`.
        newPassword:
          type: string
          format: password
          nullable: false
          minLength: 8
          maxLength: 128
          example: NewCinema2026
          description: 'The new password: at least 8 characters including a digit.'
      required:
        - currentPassword
        - newPassword
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          description: The error. Every Maqady error response has exactly this shape.
          required:
            - code
            - message
            - details
            - correlationId
          properties:
            code:
              type: string
              nullable: false
              description: Stable machine-readable code, for example RATE_LIMITED
              example: NOT_FOUND
            message:
              type: string
              nullable: false
              description: Human-readable; don't parse it
              example: The requested resource was not found.
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: Extra structured information; its shape depends on the code
              example: null
            correlationId:
              type: string
              format: uuid
              nullable: false
              description: Equals the X-Request-Id response header. Quote it when reporting a problem.
              example: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
      required:
        - error
