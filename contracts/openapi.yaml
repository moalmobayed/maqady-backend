  /auth/tokens:
    post:
      description: |-
        Public: exchange the refresh token for a new pair. Every refresh token works once; store the new pair in place of the old.

        - The same token again within 30 seconds of its use answers `REFRESH_CONFLICT` and revokes nothing: another tab or a retry already refreshed, so read the tokens it stored.
        - After 30 seconds, an already-used token is treated as stolen: the whole session is revoked (`SESSION_REVOKED`) and the customer signs in again.
        - `SESSION_EXPIRED` 30 days after sign-in; `UNAUTHENTICATED` for a token nobody issued, including a staff refresh token.
        - A blocked customer's refresh answers `ACCOUNT_BLOCKED` (the account is checked before the session, which the block revoked): show the "Account blocked" screen. Their access token, while it lasts, answers `ACCOUNT_BLOCKED` on every customer route.
        - Responses carry credentials, so `Idempotency-Key` is ignored and nothing is stored.
      operationId: refreshCustomerTokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokensRequest'
      responses:
        '201':
          description: The new token pair
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokensResponse'
        '400':
          description: '`VALIDATION_FAILED`: The body, query, path or a header failed validation. When the request could be parsed, `details.fields` lists each problem as `{ field, messages }`, with dotted paths such as `seats.0.label` (a header appears under its name, for example `Idempotency-Key`). `details` is null when the body could not be read, for example malformed JSON.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: The request is not valid.
                      details:
                        fields:
                          - field: seats.0.label
                            messages:
                              - label must be a string
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '401':
          description: |-
            `UNAUTHENTICATED`: No valid access token was sent: none, malformed, expired, or for the other site (a customer token on an admin route, or the reverse). Refresh the tokens, or sign in, and retry.

            `SESSION_EXPIRED`: The refresh token is past its lifetime. Sign in again.

            `SESSION_REVOKED`: The session was ended: signed out, the account was blocked or deactivated, or an old refresh token was reused. Sign in again.
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  summary: UNAUTHENTICATED
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Sign in to continue.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
                SESSION_EXPIRED:
                  summary: SESSION_EXPIRED
                  value:
                    error:
                      code: SESSION_EXPIRED
                      message: Your session has expired. Sign in again.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
                SESSION_REVOKED:
                  summary: SESSION_REVOKED
                  value:
                    error:
                      code: SESSION_REVOKED
                      message: You were signed out. Sign in again.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '403':
          description: '`ACCOUNT_BLOCKED`: The customer account was blocked by an admin. Contact the cinema.'
          headers:
            X-Request-Id:
              description: Correlation id for this request. Quote it when reporting a problem.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_BLOCKED:
                  summary: ACCOUNT_BLOCKED
                  value:
                    error:
                      code: ACCOUNT_BLOCKED
                      message: This account is blocked.
                      details: null
                      correlationId: 0b6f2c5e-7d41-4a8e-9a0a-2c1f6e9d3b11
        '409':
          description: '`REFRESH_CONFLICT`: The refresh token was rotated less than 30 seconds ago, typically by another tab. Read the tokens already stored and use those.'
