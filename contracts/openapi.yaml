          nullable: false
          example: '2026-10-06'
          description: 'Moves the special date to another cinema date: today''s or later, and free.'
        label:
          type: string
          nullable: false
          minLength: 1
          maxLength: 80
          example: Armed Forces Day
          description: Trimmed.
        closed:
          type: boolean
          nullable: false
          example: true
          description: True closes the theater that day (leave out the times); false opens it.
        opens:
          type: string
          nullable: false
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '11:00'
          description: Opening time, `HH:mm` from 06:00 to 23:59.
        closes:
          type: string
          nullable: false
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '02:00'
          description: Closing time, `HH:mm`; at or before 06:00 is the next day.
    TheaterPhotoUsage:
      type: string
      enum:
        - cover
        - gallery
      description: '`cover`: the 16:9 header and card photo, centre-cropped, at least 1280 × 720 after the crop; it replaces the current cover. `gallery`: one more gallery photo, kept in its shape, at least 320 pixels on the shorter side; at most 20 per theater.'
    TheaterPhotoFieldsRequest:
      type: object
      properties:
        usage:
          nullable: false
          example: gallery
          description: '`cover`: the 16:9 header and card photo, centre-cropped, at least 1280 × 720 after the crop; it replaces the current cover. `gallery`: one more gallery photo, kept in its shape, at least 320 pixels on the shorter side; at most 20 per theater.'
          allOf:
            - $ref: '#/components/schemas/TheaterPhotoUsage'
        caption:
          type: string
          nullable: false
          minLength: 1
          maxLength: 120
          example: The lobby
          description: 'Gallery photos only: shown with the photo and used as its alternative text. Trimmed.'
      required:
        - usage
    UpdateTheaterPhotoRequest:
      type: object
      properties:
        caption:
          type: string
          nullable: true
          minLength: 1
          maxLength: 120
          example: The lobby
          description: The new caption; null removes it. Trimmed.
        position:
          type: integer
          nullable: false
          minimum: 0
          maximum: 19
          example: 0
          description: The place in the gallery, from 0 (first). Past the last place means last. The other photos keep their order.
    MessageChannel:
      type: string
      enum:
        - email
        - sms
    MessageStatus:
      type: string
      enum:
        - queued
        - sent
        - failed
    MessageRelatedResponse:
      type: object
      properties:
        customerId:
          type: integer
          nullable: true
          example: 812
          description: The customer the message was sent for (verification, reset, tickets); null if none.
        staffUserId:
          type: integer
          nullable: true
          example: 3
          description: The staff member the message was sent to (invite, staff reset); null if none.
        bookingId:
          type: integer
          nullable: true
          example: 5120
          description: The booking the message is about (tickets, refunds, showtime changes); null if none.
      required:
        - customerId
        - staffUserId
        - bookingId
    MessageSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 42
          description: Message id.
        channel:
          nullable: false
          example: email
          description: '`email` is sent through Resend; `sms` is simulated (recorded, never sent).'
          allOf:
            - $ref: '#/components/schemas/MessageChannel'
        template:
          type: string
          nullable: false
          example: staff.invite
          description: 'Which message this is, as `<owner>.<event>`: for example `staff.invite`, `staff.password_reset`. Show a friendly label per value; unknown values may appear as new messages are added.'
        recipient:
          type: string
          nullable: false
          example: mona.adel@maqady.example
          description: The email address, or the phone number in E.164 for an SMS.
        subject:
          type: string
          nullable: true
          example: You're invited to the Maqady dashboard
          description: The email subject; null for an SMS.
        status:
          nullable: false
          example: sent
          description: '`queued`: waiting to be sent, or to be retried after a temporary failure. `sent`: handed to the provider. `failed`: the provider refused it, or every attempt failed; it is not retried.'
          allOf:
            - $ref: '#/components/schemas/MessageStatus'
        attempts:
          type: integer
          nullable: false
          minimum: 0
          maximum: 10
          example: 1
          description: Send attempts so far, up to 10.
        lastErrorCode:
          type: string
          nullable: true
          example: null
          description: A short machine code for the last failure, such as `timeout`, `http_500`, `validation_error` or `attempts_exhausted`; null when none failed.
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          example: null
          description: For a `queued` message, when it is next tried (it goes out on the next request to the server after that); null once sent or failed.
        sentAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-20T12:00:03+03:00'
          description: When the provider accepted it; null until then.
        related:
          nullable: false
          description: The customer, staff member or booking the message is about, by id.
          allOf:
            - $ref: '#/components/schemas/MessageRelatedResponse'
        createdAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T12:00:01+03:00'
          description: When the message was created (queued); the list is newest first by this time.
      required:
        - id
        - channel
        - template
        - recipient
        - subject
        - status
        - attempts
        - lastErrorCode
        - nextAttemptAt
        - sentAt
        - related
        - createdAt
    MessageSummaryResponsePage:
      type: object
      properties:
        items:
          nullable: false
          description: This page, in list order. Empty when nothing matches.
          type: array
          items:
            $ref: '#/components/schemas/MessageSummaryResponse'
        nextCursor:
          type: string
          nullable: true
          example: WyIyMDI2LTEwLTE2VDE5OjMwOjAwKzAzOjAwIiw0Ml0
          description: Pass as `cursor` to get the next page; null on the last page.
        total:
          type: integer
          minimum: 0
          nullable: false
          example: 42
          description: How many items the whole list has, with the same filters.
      required:
        - items
        - nextCursor
        - total
    MessageDetailResponse:
      type: object
      properties:
