info:
  title: Maqady API
  description: |-
    The Maqady cinema seat-booking API, behind the customer website and the admin dashboard.

    Conventions that apply to every endpoint:

    - Base path `/api/v1`. JSON with camelCase fields.
    - Times are ISO 8601 in Cairo time with their offset, for example `2026-10-16T19:30:00+03:00`. A cinema day runs from 06:00 to 06:00, so a 00:30 show belongs to the previous day's `cinemaDate`.
    - Ids are integers. Money is `{ "amount": <piastres>, "currency": "EGP" }`.
    - Lists are cursor-paginated and return `{ "items", "nextCursor", "total" }`.
    - Every error has the same shape (`ErrorResponse`): `{ "error": { "code", "message", "details", "correlationId" } }`. Branch on `code`, never on `message`. Each operation lists the codes it can return.
    - Every response carries an `X-Request-Id` header. Send your own UUID in `X-Request-Id` to correlate a request; any other value is replaced with a new UUID.
    - Writes accept an `Idempotency-Key` header: a new UUID per user action, reused when retrying that same action.
    - Signed-in routes take `Authorization: Bearer <access token>`: the `customer` scheme on the customer website, `staff` on the admin dashboard.
    - The free server sleeps when idle, so the first request after a pause can take much longer. Show a "waking up" state rather than an error; `GET /health` is a cheap way to wake it.
  version: 0.1.0
tags:
  - name: Health
    description: Liveness and readiness
  - name: 'Admin: auth'
    description: Staff sign-in, token refresh, sign-out, the signed-in member, "Forgot password" and the set-password page
  - name: 'Admin: staff'
    description: 'Staff accounts: list, invites, roles and status (admins only)'
  - name: 'Admin: messages'
    description: 'The Message log: every email and SMS with its delivery status (admins only)'
servers:
  - url: /api/v1
    description: The server hosting these docs
  - url: http://localhost:3000/api/v1
    description: Local development
components:
  securitySchemes:
    customer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Customer access token (15 minutes), from customer sign-in or refresh.
    staff:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Staff access token (15 minutes), from staff sign-in or refresh.
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          nullable: false
          example: ok
          description: Always `ok`. A failed check answers with an error response instead.
      required:
        - status
    StaffSignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: mona.adel@maqady.example
          description: The staff email. Letter case does not matter.
        password:
          type: string
          format: password
          nullable: false
          minLength: 1
          maxLength: 128
          example: Cinema2026
          description: The password as typed. The password policy is not checked here.
      required:
        - email
        - password
    StaffRole:
      type: string
      enum:
        - admin
        - box_office
      description: '`admin` sees every screen; `box_office` sees Bookings, Customers and Scan tickets. Read from the database on every request.'
    StaffProfileResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 3
          description: Staff member id.
        fullName:
          type: string
          nullable: false
          example: Mona Adel
          description: Full name.
        email:
          type: string
          format: email
          nullable: false
          example: mona.adel@maqady.example
          description: Staff email.
        role:
          nullable: false
          example: admin
          description: '`admin` sees every screen; `box_office` sees Bookings, Customers and Scan tickets. Read from the database on every request.'
          allOf:
            - $ref: '#/components/schemas/StaffRole'
      required:
        - id
        - fullName
        - email
        - role
    StaffSessionResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
          description: 'Send as `Authorization: Bearer <accessToken>`. Valid 15 minutes; keep it in memory only.'
        accessTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:45:00+03:00'
          description: When the access token stops working. Refresh shortly before.
        refreshToken:
          type: string
          nullable: false
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: Opaque, single use. Exchange it at the refresh route for a new pair, and store the new one in place of this one.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-21T07:30:00+03:00'
          description: 'When the session ends: 12 hours after sign-in for staff, 30 days for customers. Refreshing never extends it; sign in again after.'
        staff:
          nullable: false
          description: Who signed in, for the dashboard shell.
          allOf:
            - $ref: '#/components/schemas/StaffProfileResponse'
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - staff
    RefreshTokensRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: false
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: 'The refresh token from the last sign-in or refresh. Each one works once: replace both stored tokens with the pair this call returns.'
      required:
        - refreshToken
    SessionTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: false
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl
          description: 'Send as `Authorization: Bearer <accessToken>`. Valid 15 minutes; keep it in memory only.'
        accessTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T19:45:00+03:00'
          description: When the access token stops working. Refresh shortly before.
        refreshToken:
          type: string
          nullable: false
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: Opaque, single use. Exchange it at the refresh route for a new pair, and store the new one in place of this one.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-21T07:30:00+03:00'
          description: 'When the session ends: 12 hours after sign-in for staff, 30 days for customers. Refreshing never extends it; sign in again after.'
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
    StaffPasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: mona.adel@maqady.example
          description: The staff email. Letter case and surrounding spaces do not matter.
      required:
        - email
    StaffPasswordSetupRequest:
      type: object
      properties:
        token:
          type: string
          nullable: false
          minLength: 1
          maxLength: 128
          example: q3VbI2vT0xSx5n2b7i1d9mJ8kQe4zW6yR0tP5uL3aGc
          description: The `token` query parameter of the emailed link (`/admin/set-password?token=…`), unchanged. Invite and reset links both work here. A token that is unknown, used or expired is `INVALID_TOKEN`, never `VALIDATION_FAILED`.
        password:
          type: string
          format: password
          nullable: false
          minLength: 8
          maxLength: 128
          example: Cinema2026
          description: 'The new password: 8 to 128 characters including a digit. A password that breaks the rule is `VALIDATION_FAILED` and leaves the link usable.'
      required:
        - token
        - password
    StaffStatus:
      type: string
      enum:
        - invited
        - active
        - deactivated
    StaffMemberResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 3
          description: Staff member id.
        fullName:
          type: string
          nullable: false
          example: Mona Adel
          description: Full name.
        email:
          type: string
          format: email
          nullable: false
          example: mona.adel@maqady.example
          description: Staff email; unique among staff.
        role:
          nullable: false
          example: box_office
          description: '`admin` or `box_office`.'
          allOf:
            - $ref: '#/components/schemas/StaffRole'
        status:
          nullable: false
          example: active
          description: '`invited`: has not set a password yet. `active`: may sign in. `deactivated`: switched off by an admin; can be reactivated.'
          allOf:
            - $ref: '#/components/schemas/StaffStatus'
        lastSignInAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-20T09:12:00+03:00'
          description: The last successful sign-in; null if the member never signed in.
        createdAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-01T10:00:00+03:00'
          description: When the member was created (invited, or created by the setup command).
      required:
        - id
        - fullName
        - email
        - role
        - status
        - lastSignInAt
        - createdAt
    StaffMemberResponsePage:
      type: object
      properties:
        items:
          nullable: false
          description: This page, in list order. Empty when nothing matches.
          type: array
          items:
            $ref: '#/components/schemas/StaffMemberResponse'
        nextCursor:
          type: string
          nullable: true
          example: WyIyMDI2LTEwLTE2VDE5OjMwOjAwKzAzOjAwIiw0Ml0
          description: Pass as `cursor` to get the next page; null on the last page.
        total:
          type: integer
          minimum: 0
          nullable: false
          example: 42
          description: How many items the whole list has, with the same filters.
      required:
        - items
        - nextCursor
        - total
    UpdateStaffMemberRequest:
      type: object
      properties:
        role:
          nullable: false
          example: box_office
          description: The new role. Demoting an admin signs them out everywhere; they sign in again as box office. Refused with `LAST_ADMIN` for the only active admin.
          allOf:
            - $ref: '#/components/schemas/StaffRole'
        status:
          type: string
          enum:
            - active
            - deactivated
          nullable: false
          example: deactivated
          description: '`deactivated` signs the member out everywhere and voids their unused invite or reset links; refused with `LAST_ADMIN` for the only active admin. `active` reactivates a deactivated member; one who never set a password returns to `invited` instead, so the invite can be resent. `active` on an invited member is `VALIDATION_FAILED`: they become active by setting their password.'
    InviteStaffMemberRequest:
      type: object
      properties:
        fullName:
          type: string
          nullable: false
          minLength: 1
          maxLength: 100
          example: Mona Adel
          description: Full name, shown in the dashboard and the email. Surrounding spaces are removed.
        email:
          type: string
          format: email
          nullable: false
          maxLength: 320
          example: mona.adel@maqady.example
          description: Where the invite goes, and the sign-in email afterwards. Unique among staff whatever the letter case (`EMAIL_TAKEN`). Surrounding spaces are removed.
        role:
          nullable: false
          example: box_office
          description: '`admin` sees every screen; `box_office` sees Bookings, Customers and Scan tickets. Can be changed later.'
          allOf:
            - $ref: '#/components/schemas/StaffRole'
      required:
        - fullName
        - email
        - role
    StaffInvitationResponse:
      type: object
      properties:
        staffUserId:
          type: integer
          nullable: false
          example: 3
          description: The invited staff member.
        expiresAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-23T10:00:00+03:00'
          description: 'When the new link stops working: 72 hours after it was sent.'
      required:
        - staffUserId
        - expiresAt
    MessageChannel:
      type: string
      enum:
        - email
        - sms
    MessageStatus:
      type: string
      enum:
        - queued
        - sent
        - failed
    MessageRelatedResponse:
      type: object
      properties:
        customerId:
          type: integer
          nullable: true
          example: 812
          description: The customer the message was sent for (verification, reset, tickets); null if none.
        staffUserId:
          type: integer
          nullable: true
          example: 3
          description: The staff member the message was sent to (invite, staff reset); null if none.
        bookingId:
          type: integer
          nullable: true
          example: 5120
          description: The booking the message is about (tickets, refunds, showtime changes); null if none.
      required:
        - customerId
        - staffUserId
        - bookingId
    MessageSummaryResponse:
      type: object
      properties:
        id:
          type: integer
          nullable: false
          example: 42
          description: Message id.
        channel:
          nullable: false
          example: email
          description: '`email` is sent through Resend; `sms` is simulated (recorded, never sent).'
          allOf:
            - $ref: '#/components/schemas/MessageChannel'
        template:
          type: string
          nullable: false
          example: staff.invite
          description: 'Which message this is, as `<owner>.<event>`: for example `staff.invite`, `staff.password_reset`. Show a friendly label per value; unknown values may appear as new messages are added.'
        recipient:
          type: string
          nullable: false
          example: mona.adel@maqady.example
          description: The email address, or the phone number in E.164 for an SMS.
        subject:
          type: string
          nullable: true
          example: You're invited to the Maqady dashboard
          description: The email subject; null for an SMS.
        status:
          nullable: false
          example: sent
          description: '`queued`: waiting to be sent, or to be retried after a temporary failure. `sent`: handed to the provider. `failed`: the provider refused it, or every attempt failed; it is not retried.'
          allOf:
            - $ref: '#/components/schemas/MessageStatus'
        attempts:
          type: integer
          nullable: false
          minimum: 0
          maximum: 10
          example: 1
          description: Send attempts so far, up to 10.
        lastErrorCode:
          type: string
          nullable: true
          example: null
          description: A short machine code for the last failure, such as `timeout`, `http_500`, `validation_error` or `attempts_exhausted`; null when none failed.
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          example: null
          description: For a `queued` message, when it is next tried (it goes out on the next request to the server after that); null once sent or failed.
        sentAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-10-20T12:00:03+03:00'
          description: When the provider accepted it; null until then.
        related:
          nullable: false
          description: The customer, staff member or booking the message is about, by id.
          allOf:
            - $ref: '#/components/schemas/MessageRelatedResponse'
        createdAt:
          type: string
          format: date-time
          nullable: false
          example: '2026-10-20T12:00:01+03:00'
          description: When the message was created (queued); the list is newest first by this time.
      required:
        - id
        - channel
        - template
        - recipient
        - subject
        - status
        - attempts
        - lastErrorCode
        - nextAttemptAt
        - sentAt
        - related
        - createdAt
    MessageSummaryResponsePage:
      type: object
      properties:
        items:
          nullable: false
          description: This page, in list order. Empty when nothing matches.
          type: array
          items:
            $ref: '#/components/schemas/MessageSummaryResponse'
        nextCursor:
          type: string
          nullable: true
          example: WyIyMDI2LTEwLTE2VDE5OjMwOjAwKzAzOjAwIiw0Ml0
          description: Pass as `cursor` to get the next page; null on the last page.
        total:
          type: integer
          minimum: 0
          nullable: false
          example: 42
          description: How many items the whole list has, with the same filters.
      required:
        - items
        - nextCursor
        - total
