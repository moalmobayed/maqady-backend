  /admin/staff/{id}:
    patch:
      description: |-
        Admin only: change role, deactivate, or reactivate. Changes take effect on the member's next request.

        - There is always at least one active admin: demoting or deactivating the only one is `LAST_ADMIN`, also when two admins change each other at the same moment. Admins may change themselves within that rule.
        - Deactivating signs the member out everywhere and voids their unused invite and reset links. Demoting an admin signs them out, so they sign in again as box office.
        - Reactivating a member who never set a password returns them to `invited`.
        - A change to the values the member already has answers `200` and changes nothing.
        - Recorded in the activity log with the names of the changed fields.
      operationId: updateStaffMember
      parameters:
        - name: id
          required: true
          in: path
