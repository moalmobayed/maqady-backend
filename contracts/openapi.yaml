  /admin/staff/{id}:
    patch:
      description: |-
        Admin only: change role, deactivate, or reactivate. Changes take effect on the member's next request.

        - There is always at least one active admin: demoting or deactivating the only one is `LAST_ADMIN`, also when two admins change each other at the same moment. Admins may change themselves within that rule.
