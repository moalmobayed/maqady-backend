name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maqady_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maqady_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The integration suite migrates this database from zero; its name must end in _test.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/maqady_test

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered to fail fast: the cheapest check first.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit, then integration against Postgres)
        run: npm test

      - name: Build
        run: npm run build

      # contracts/openapi.yaml is generated from the code; a stale committed copy fails the job.
      - name: Contract is current
        run: npm run contract && git diff --exit-code contracts/openapi.yaml
